# .github/workflows/ansible-ci.yml
# Chapter 10, Listing 10-6 & 10-7 — Complete infrastructure CI/CD pipeline
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
#
# Required secrets (Settings → Secrets → Actions):
#   ANSIBLE_SSH_KEY       — Private SSH key for staging
#   ANSIBLE_PROD_SSH_KEY  — Private SSH key for production
#   VAULT_PASSWORD        — Ansible Vault password (staging)
#   VAULT_PASSWORD_PROD   — Ansible Vault password (production)
#   OPENAI_API_KEY        — OpenAI API key (optional; falls back to Anthropic)
#   ANTHROPIC_API_KEY     — Anthropic API key (optional; falls back to Ollama)
#   SLACK_BOT_TOKEN       — Slack bot token for notifications
---
name: Ansible Infrastructure CI/CD

on:
  push:
    branches: [main]
    paths:
      - "roles/**"
      - "playbooks/**"
      - "inventory/**"
      - "*.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger

env:
  ANSIBLE_FORCE_COLOR: "1"
  PY_COLORS:           "1"
  ANSIBLE_STDOUT_CALLBACK: yaml

jobs:

  # ── Stage 1: Syntax Check (< 15 seconds) ────────────────────────────────
  syntax-check:
    runs-on: ubuntu-latest
    name: "Stage 1: Syntax Check"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ansible
        run: pip install ansible-core==2.15.*

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check all playbooks
        run: |
          find . -name "*.yml" -path "*/playbooks/*" \
            ! -path "*/.github/*" \
            ! -path "*/molecule/*" | \
          while read f; do
            echo "Checking: $f"
            ansible-playbook --syntax-check "$f" -i inventory/ 2>&1 || exit 1
          done

  # ── Stage 2: ansible-lint (< 30 seconds) ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    name: "Stage 2: ansible-lint"
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v24
        with:
          args: "--profile production"

  # ── Stage 3: AI Code Review (ADVISORY — never blocks the pipeline) ──────
  # LLM output is non-deterministic, so it must not be a hard gate. Findings
  # are posted to the job summary for the human reviewer. Data governance:
  # the review sends playbook text to an LLM. Enable it only where policy
  # allows (repository variable AI_REVIEW_ENABLED=true) and point it at an
  # approved endpoint (e.g. a private/internal model) via the Chapter 4
  # provider abstraction. Never put secrets or inventory data in reviewed files.
  ai-review:
    runs-on: ubuntu-latest
    name: "Stage 3: AI Review (advisory)"
    needs: lint
    if: github.event_name == 'pull_request' && vars.AI_REVIEW_ENABLED == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI review dependencies
        run: pip install openai anthropic pyyaml requests
      - name: Find changed Ansible files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E "\.(yml|yaml)$" \
            | grep -vE "^(\.github|molecule|tests)" \
            | head -20 | tr "\n" " ")
          echo "files=$FILES" >> $GITHUB_OUTPUT
      - name: Run AI playbook review (report only)
        if: steps.changed.outputs.files != ''
        env:
          LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "### AI review: $f" >> "$GITHUB_STEP_SUMMARY"
            python3 chapters/ch04-llm-playbook-generation/scripts/review_playbook.py \
              --playbook "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done

  # ── Stage 4: Molecule Tests ──────────────────────────────────────────────
  molecule:
    runs-on: ubuntu-latest
    name: "Stage 4: Molecule (${{ matrix.role }})"
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        role:
          - linux_baseline
          - cis_rhel9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Molecule and dependencies
        run: |
          pip install molecule molecule-docker ansible-lint
          pip install ansible-core==2.15.*

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule tests for ${{ matrix.role }}
        run: |
          cd roles/${{ matrix.role }}
          molecule test
        env:
          PY_COLORS:            "1"
          ANSIBLE_FORCE_COLOR:  "1"
          MOLECULE_NO_LOG:      "false"

  # ── Stage 5: Security Scan ───────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    name: "Stage 5: Security Scan (Checkov)"
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov IaC security scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory:           "."
          framework:           ansible
          output_format:       sarif
          output_file_path:    checkov-results.sarif
          soft_fail:           false
          quiet:               true

      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ── Stage 6: Deploy to Staging (after merge to main) ───────────────────
  deploy-staging:
    # Self-hosted runner INSIDE the network: GitHub-hosted runners cannot
    # reach internal servers, and a runner label limits which jobs may use it.
    runs-on: [self-hosted, linux, ansible-staging]
    name: "Stage 6: Deploy to Staging"
    needs: [molecule, security-scan]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: staging

    permissions:
      id-token: write    # OIDC token: no long-lived cloud or Vault secret stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible and collections
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install ansible-core==2.15.* boto3 requests
          ansible-galaxy collection install -r requirements.yml

      # GitHub's OIDC token is exchanged for a short-lived Vault token.
      # Only this repository, this environment and this ref may use the role.
      - name: Authenticate to Vault with OIDC (no stored credentials)
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.company.com
          method: jwt
          role: github-ansible-staging
          exportToken: true
          secrets: |
            secret/data/ansible/staging vault_password | ANSIBLE_VAULT_PASSWORD

      # Ephemeral key signed by Vault's SSH CA, valid for 15 minutes.
      - name: Issue short-lived SSH certificate
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/id_ansible"
          vault write -field=signed_key ssh/sign/ansible-staging \
            public_key=@"$RUNNER_TEMP/id_ansible.pub" \
            valid_principals=ansible ttl=15m \
            > "$RUNNER_TEMP/id_ansible-cert.pub"

      - name: Deploy to staging
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          ansible-playbook -i inventory/ site.yml \
            --limit staging \
            --private-key "$RUNNER_TEMP/id_ansible" \
            --vault-password-file <(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            -e "deployment_id=${{ github.sha }}"

      - name: Compliance gate — staging
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          ansible-playbook -i inventory/ \
            chapters/ch05-compliance-governance/playbooks/compliance_check.yml \
            --limit staging \
            --private-key "$RUNNER_TEMP/id_ansible" \
            --vault-password-file <(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            -e "min_compliance_score=90"

      - name: Remove ephemeral credentials
        if: always()
        run: rm -f "$RUNNER_TEMP"/id_ansible*

  # ── Stage 7: Deploy to Production (manual approval, after staging) ─────
  deploy-production:
    # Self-hosted runner INSIDE the network: GitHub-hosted runners cannot
    # reach internal servers, and a runner label limits which jobs may use it.
    runs-on: [self-hosted, linux, ansible-prod]
    name: "Stage 7: Deploy to Production"
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      # Required reviewers: Settings → Environments → production
    permissions:
      id-token: write    # OIDC token: no long-lived cloud or Vault secret stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible and collections
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install ansible-core==2.15.* boto3 requests
          ansible-galaxy collection install -r requirements.yml

      # GitHub's OIDC token is exchanged for a short-lived Vault token.
      # Only this repository, this environment and this ref may use the role.
      - name: Authenticate to Vault with OIDC (no stored credentials)
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.company.com
          method: jwt
          role: github-ansible-production
          exportToken: true
          secrets: |
            secret/data/ansible/production vault_password | ANSIBLE_VAULT_PASSWORD

      # Ephemeral key signed by Vault's SSH CA, valid for 15 minutes.
      - name: Issue short-lived SSH certificate
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/id_ansible"
          vault write -field=signed_key ssh/sign/ansible-production \
            public_key=@"$RUNNER_TEMP/id_ansible.pub" \
            valid_principals=ansible ttl=15m \
            > "$RUNNER_TEMP/id_ansible-cert.pub"

      - name: Deploy to production
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          ansible-playbook -i inventory/ site.yml \
            --limit production \
            --private-key "$RUNNER_TEMP/id_ansible" \
            --vault-password-file <(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            -e "deployment_id=${{ github.sha }}" \
            -e "serial=10%"

      - name: Compliance gate — production
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          ansible-playbook -i inventory/ \
            chapters/ch05-compliance-governance/playbooks/compliance_check.yml \
            --limit production \
            --private-key "$RUNNER_TEMP/id_ansible" \
            --vault-password-file <(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            -e "min_compliance_score=95"

      - name: Remove ephemeral credentials
        if: always()
        run: rm -f "$RUNNER_TEMP"/id_ansible*

      - name: Notify Slack — deployment success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: infrastructure-deployments
          slack-message: |
            ✅ *Production deployment successful*
            Commit: `${{ github.sha }}`
            Author: ${{ github.actor }}
            Branch: ${{ github.ref_name }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack — deployment failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: infrastructure-deployments
          slack-message: |
            ❌ *Production deployment FAILED*
            Commit: `${{ github.sha }}`
            Author: ${{ github.actor }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
