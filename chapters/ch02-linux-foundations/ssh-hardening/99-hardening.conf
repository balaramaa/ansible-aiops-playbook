# /etc/ssh/sshd_config.d/99-hardening.conf
# Chapter 2, Listing 2-12 — CIS RHEL 9 Benchmark Level 1 SSH Hardening
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
#
# Deploy via Ansible (Chapter 8):
#   ansible.builtin.template:
#     src: 99-hardening.conf.j2
#     dest: /etc/ssh/sshd_config.d/99-hardening.conf
#     owner: root
#     group: root
#     mode: '0600'
#   notify: reload sshd
#
# Validate after deployment:
#   sudo sshd -t   (test config syntax)
#   ssh-audit localhost   (audit SSH configuration)

# ── Authentication ─────────────────────────────────────────────────────────
# CIS 5.1.1 - Disable root login via SSH
PermitRootLogin no

# CIS 5.1.11 - Disable empty password authentication
PermitEmptyPasswords no

# CIS 5.1.8 - Disable host-based authentication
IgnoreRhosts yes
HostbasedAuthentication no

# ── Session limits ─────────────────────────────────────────────────────────
# CIS 5.1.7 - Limit authentication attempts
MaxAuthTries 3

# CIS 5.1.19 - Set login grace time (seconds)
LoginGraceTime 60

# CIS 5.1.20 - Set idle timeout (5 minutes = 300 seconds)
# Connection is terminated after 300 seconds of inactivity
ClientAliveInterval 300
ClientAliveCountMax 0

# ── Forwarding ─────────────────────────────────────────────────────────────
# CIS 5.1.6 - Disable X11 forwarding (unnecessary attack surface)
X11Forwarding no

# Disable agent and TCP forwarding unless explicitly required
AllowAgentForwarding no
AllowTcpForwarding no

# ── Logging ────────────────────────────────────────────────────────────────
# VERBOSE enables logging of public key fingerprints for audit trails
LogLevel VERBOSE

# ── Cryptographic controls ─────────────────────────────────────────────────
# NIST-approved key exchange algorithms only
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256

# NIST-approved MACs only (ETM variants preferred)
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# NIST-approved ciphers only
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
