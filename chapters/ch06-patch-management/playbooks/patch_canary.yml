# playbooks/patch_canary.yml
# Chapter 6, Listing 6-6 — Canary patching with automated health validation
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
#
# Usage:
#   # Dry run (preview changes)
#   ansible-playbook -i inventory/ playbooks/patch_canary.yml \
#     --limit prod_web \
#     -e "errata_ids=['RHSA-2024:0003'] target_group=prod_web" \
#     --check --diff
#
#   # Apply patches
#   ansible-playbook -i inventory/ playbooks/patch_canary.yml \
#     --limit prod_web \
#     -e "errata_ids=['RHSA-2024:0003'] target_group=prod_web"
#
# Variables:
#   errata_ids:        List of Satellite errata IDs to apply
#   target_group:      Ansible host group (for serial calculation)
#   canary_percentage: Percentage of hosts for canary phase (default: 5%)
#   full_percentage:   Percentage of hosts per batch after canary (default: 20%)
#   max_fail_canary:   Canary phase: 0 (halt on any failure)
#   max_fail_full:     Full fleet phase: 5% (allow up to 5% failures)
---
- name: "Phase 1 — Canary patch ({{ canary_percentage | default('5') }}% of fleet)"
  hosts: "{{ target_group }}"
  become: true
  gather_facts: true
  serial: "{{ canary_percentage | default('5') }}%"
  max_fail_percentage: "{{ max_fail_canary | default(0) }}"

  pre_tasks:
    - name: Capture pre-patch system fingerprint
      ansible.builtin.set_fact:
        pre_patch_kernel:    "{{ ansible_kernel }}"
        pre_patch_timestamp: "{{ ansible_date_time.iso8601 }}"
      tags: pre_check

    - name: Verify SSH is running before patching
      ansible.builtin.assert:
        that:
          - ansible_facts.services is defined
        fail_msg: >
          Cannot verify service state on {{ inventory_hostname }}.
          Aborting patch to avoid unknown state.
      tags: pre_check

    - name: Check disk space is sufficient for patching
      ansible.builtin.assert:
        that:
          - item.size_available > 1073741824  # 1 GB minimum
        fail_msg: >
          Insufficient disk space on {{ inventory_hostname }}
          ({{ item.mount }}): {{ item.size_available | human_readable }} available.
        loop: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | list }}"
      tags: pre_check

  tasks:
    - name: Apply security errata via dnf
      ansible.builtin.dnf:
        name:     "*"
        state:    latest
        security: true
        bugfix:   false
      register: patch_result
      tags: patch

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required
      tags: patch

    - name: Reboot if kernel was updated
      ansible.builtin.reboot:
        reboot_timeout: 300
        connect_timeout: 20
        test_command: uptime
        msg: "Rebooting after kernel patch — automated patch management"
      when:
        - patch_result.changed
        - '"kernel" in (patch_result.results | map(attribute="name") | list | join(","))'
      tags: patch

  post_tasks:
    - name: Refresh service facts after patching
      ansible.builtin.service_facts:
      tags: post_check

    - name: Assert sshd is running after patch
      ansible.builtin.assert:
        that:
          - ansible_facts.services["sshd.service"]["state"] == "running"
        fail_msg: >
          CANARY HEALTH CHECK FAILED: sshd not running on {{ inventory_hostname }}
          after patching. Halting canary phase — DO NOT proceed to full fleet.
          Manual intervention required.
      tags: post_check

    - name: Record successful canary patch
      ansible.builtin.lineinfile:
        path: /var/log/patch_audit.log
        line: >
          {{ ansible_date_time.iso8601 }}
          PHASE=canary STATUS=success
          host={{ inventory_hostname }}
          kernel_before={{ pre_patch_kernel }}
          kernel_after={{ ansible_kernel }}
          errata={{ errata_ids | join(",") }}
        create: true
        mode: "0640"
      tags: post_check

# ── Phase 2: Full fleet (runs only after Phase 1 succeeds) ───────────────────
- name: "Phase 2 — Full fleet patch ({{ full_percentage | default('20') }}% batches)"
  hosts: "{{ target_group }}"
  become: true
  gather_facts: false
  serial: "{{ full_percentage | default('20') }}%"
  max_fail_percentage: "{{ max_fail_full | default(5) }}"

  tasks:
    - name: Apply security errata (full fleet)
      ansible.builtin.dnf:
        name:     "*"
        state:    latest
        security: true
      register: patch_result
      tags: patch

    - name: Reboot if kernel was updated
      ansible.builtin.reboot:
        reboot_timeout: 300
        test_command:   uptime
        msg:            "Rebooting after kernel patch — automated patch management"
      when:
        - patch_result.changed
        - '"kernel" in (patch_result.results | map(attribute="name") | list | join(","))'
      tags: patch

    - name: Record full fleet patch completion
      ansible.builtin.lineinfile:
        path: /var/log/patch_audit.log
        line: >
          {{ ansible_date_time.iso8601 }}
          PHASE=full STATUS=success
          host={{ inventory_hostname }}
          errata={{ errata_ids | join(",") }}
        create: true
        mode: "0640"
      tags: post_check
