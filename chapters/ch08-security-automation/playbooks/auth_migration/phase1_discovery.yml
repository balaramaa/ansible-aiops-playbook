# playbooks/auth_migration/phase1_discovery.yml
# Chapter 8, Listing 8-9 — Authentication migration Phase 1: Discovery
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
#
# This playbook inventories every server's current authentication configuration
# and produces a migration readiness report.
#
# Usage:
#   mkdir -p /tmp/auth_discovery
#   ansible-playbook -i inventory/ playbooks/auth_migration/phase1_discovery.yml \
#     --limit prod_web
#   # Review output in /tmp/auth_discovery/*.json
---
- name: "Phase 1 — Authentication configuration discovery"
  hosts: "{{ target_group | default('all') }}"
  become: true
  gather_facts: true

  tasks:
    - name: Hash PAM sshd configuration
      ansible.builtin.stat:
        path: /etc/pam.d/sshd
        checksum_algorithm: sha256
      register: pam_sshd
      tags: discovery

    - name: Read nsswitch passwd source
      ansible.builtin.command:
        cmd: grep -E '^passwd:' /etc/nsswitch.conf
      register: nss_passwd
      changed_when: false
      failed_when: false
      tags: discovery

    - name: Check SSSD service state
      ansible.builtin.command:
        cmd: systemctl is-active sssd
      register: sssd_state
      changed_when: false
      failed_when: false
      tags: discovery

    - name: Check FreeIPA enrolment
      ansible.builtin.stat:
        path: /etc/ipa/default.conf
      register: ipa_conf
      tags: discovery

    - name: Count authorized_keys files
      ansible.builtin.find:
        paths: [/home, /root]
        patterns: authorized_keys
        recurse: true
      register: ak_files
      tags: discovery

    - name: Count NOPASSWD sudo entries
      ansible.builtin.shell:
        cmd: grep -rhE '^[^#]*NOPASSWD' /etc/sudoers /etc/sudoers.d 2>/dev/null | wc -l
      register: nopasswd_count
      changed_when: false
      failed_when: false
      tags: discovery

    # Build the record as a dictionary and let Ansible serialise it, so the
    # JSON is always valid (no hand-written echo lines or trailing commas).
    - name: Build discovery record
      ansible.builtin.set_fact:
        auth_config:
          hostname: "{{ inventory_hostname }}"
          pam_sshd_sha256: "{{ pam_sshd.stat.checksum | default('') }}"
          nsswitch_passwd: "{{ nss_passwd.stdout | default('') | trim }}"
          sssd_running: "{{ (sssd_state.rc | default(1)) == 0 }}"
          ldap_configured: "{{ 'ldap' in (nss_passwd.stdout | default('')) }}"
          freeipa_enrolled: "{{ ipa_conf.stat.exists }}"
          authorized_keys_count: "{{ ak_files.matched | int }}"
          sudo_nopasswd_count: "{{ nopasswd_count.stdout | trim | int }}"
      tags: discovery

    - name: Ensure discovery output directory exists
      ansible.builtin.file:
        path: /tmp/auth_discovery
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      tags: discovery

    - name: Save discovery results locally
      ansible.builtin.copy:
        content: "{{ auth_config | to_nice_json }}"
        dest: "/tmp/auth_discovery/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false
      tags: discovery

    - name: Assess migration readiness
      ansible.builtin.set_fact:
        migration_ready: "{{ (auth_config.sssd_running | bool) or (auth_config.ldap_configured | bool) }}"
        already_migrated: "{{ auth_config.freeipa_enrolled | bool }}"
      tags: discovery

    - name: Flag servers needing manual assessment
      ansible.builtin.debug:
        msg: >
          ⚠ {{ inventory_hostname }} may need manual assessment:
          no standard auth configuration (SSSD/LDAP) detected.
          Check: {{ auth_config }}
      when: not migration_ready | bool and not already_migrated | bool
      tags: discovery

    - name: Flag servers already migrated
      ansible.builtin.debug:
        msg: "✔ {{ inventory_hostname }} already on FreeIPA/IdM — skip migration"
      when: already_migrated | bool
      tags: discovery

- name: Generate discovery summary report
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Aggregate discovery results
      ansible.builtin.shell:
        cmd: |
          python3 -c "
          import json, os, glob
          files  = glob.glob('/tmp/auth_discovery/*.json')
          report = {'total': len(files), 'ready': 0, 'needs_assessment': 0, 'already_migrated': 0, 'hosts': []}
          for f in files:
              d = json.load(open(f))
              if d.get('freeipa_enrolled'): report['already_migrated'] += 1
              elif d.get('sssd_running') or d.get('ldap_configured'): report['ready'] += 1
              else: report['needs_assessment'] += 1
              report['hosts'].append({'hostname': d['hostname'], 'sssd_running': d.get('sssd_running'), 'ready': d.get('sssd_running') or d.get('ldap_configured')})
          print(json.dumps(report, indent=2))
          "
      register: summary
      changed_when: false
      tags: discovery

    - name: Display migration readiness summary
      ansible.builtin.debug:
        msg: |
          Authentication Migration Discovery Summary
          ==========================================
          {{ summary.stdout | from_json | to_nice_json }}
      tags: discovery
