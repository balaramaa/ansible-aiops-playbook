# site.yml — Chapter 3, Enterprise-wide baseline playbook
# Author : Balaramakrishna Alti
---
- name: Apply baseline configuration to all managed nodes
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify Ansible version
      ansible.builtin.assert:
        that: ansible_version.full is version("2.15", ">=")
        fail_msg: "Ansible 2.15+ required. Found: {{ ansible_version.full }}"

    - name: Verify target OS is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution_major_version | int >= 8
        fail_msg: "Unsupported OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  roles:
    - role: linux_baseline
      tags: baseline

  post_tasks:
    - name: Verify SSH is accessible after hardening
      ansible.builtin.wait_for_connection:
        timeout: 30
      tags: [ssh, verify]

    - name: Display baseline summary
      ansible.builtin.debug:
        msg:
          - "Host    : {{ inventory_hostname }}"
          - "OS      : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "SELinux : {{ ansible_selinux.status }}"
          - "Applied : {{ ansible_date_time.iso8601 }}"
      tags: always
