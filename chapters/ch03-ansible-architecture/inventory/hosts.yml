# inventory/hosts.yml — Group structure
# Chapter 3, Listing 3-3
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
#
# This file defines the GROUP HIERARCHY only.
# Host-specific variables go in host_vars/<hostname>.yml
# Group variables go in group_vars/<groupname>.yml
---
all:
  children:
    production:
      children:
        prod_web:
          hosts:
            web[01:10].prod.company.com:
        prod_db:
          hosts:
            db[01:04].prod.company.com:
        prod_app:
          hosts:
            app[01:20].prod.company.com:

    staging:
      children:
        stg_web:
        stg_db:
        stg_app:

    lab:
      hosts:
        node01:
          ansible_host: 192.168.1.11
        node02:
          ansible_host: 192.168.1.12
        node03:
          ansible_host: 192.168.1.13
