# roles/cis_rhel9/handlers/main.yml
# Chapter 5 — CIS compliance role handlers
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
---
- name: reload sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded

- name: restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted

- name: load auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true

- name: reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
