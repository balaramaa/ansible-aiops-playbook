# roles/cis_rhel9/defaults/main.yml
# Chapter 5 — CIS RHEL 9 Benchmark compliance role defaults
# All policy values are variables — review with your security team
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
---

# ── Compliance profile ─────────────────────────────────────────────────────
# Override in group_vars/production.yml: compliance_level: level2
cis_level: "{{ compliance_level | default('level1') }}"

# ── Section 1: Initial Setup ───────────────────────────────────────────────
cis_selinux_state: enforcing
cis_selinux_policy: targeted

# Packages to remove (CIS 2.2.x — unnecessary services)
cis_packages_remove:
  - telnet
  - rsh
  - rsh-server
  - ypserv
  - ypbind
  - tftp
  - tftp-server
  - talk
  - talk-server

# Kernel modules to disable
cis_modules_disable:
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - udf

# ── Section 3: Network ──────────────────────────────────────────────────────
cis_sysctl_network:
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0

# ── Section 4: Logging and Auditing ────────────────────────────────────────
cis_auditd_max_log_file: 8
cis_auditd_max_log_file_action: keep_logs
cis_auditd_space_left_action: email
cis_auditd_action_mail_acct: root
cis_auditd_admin_space_left_action: halt
cis_auditd_rules_file: /etc/audit/rules.d/99-cis.rules

# ── Section 5: Access, Authentication, Authorization ───────────────────────
# SSH
cis_ssh_max_auth_tries: 3
cis_ssh_client_alive_interval: 300
cis_ssh_client_alive_count_max: 0
cis_ssh_login_grace_time: 60
cis_ssh_permit_root_login: "no"
cis_ssh_permit_empty_passwords: "no"
cis_ssh_x11_forwarding: "no"
cis_ssh_allow_agent_forwarding: "no"
cis_ssh_allow_tcp_forwarding: "no"
cis_ssh_log_level: VERBOSE

# Password policy
cis_pass_max_days: 365
cis_pass_min_days: 7
cis_pass_warn_age: 7
cis_pass_min_len: 14

# ── Reporting ────────────────────────────────────────────────────────────────
cis_report_dir: /var/log/compliance
cis_report_retention_days: 365
