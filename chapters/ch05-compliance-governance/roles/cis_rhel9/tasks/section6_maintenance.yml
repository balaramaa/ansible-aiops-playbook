# roles/cis_rhel9/tasks/section6_maintenance.yml
# Chapter 5 — CIS Section 6: System Maintenance
#
# Author : Balaramakrishna Alti
# GitHub : https://github.com/balaramaa/ansible-aiops-playbook
---

# ── CIS 6.1 System File Permissions ──────────────────────────────────────────

- name: "CIS 6.1.1 | Ensure permissions on /etc/passwd are configured"
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: "0644"
  tags: [cis, cis_6_1_1, permissions, section6]

- name: "CIS 6.1.2 | Ensure permissions on /etc/passwd- are configured"
  ansible.builtin.file:
    path: /etc/passwd-
    owner: root
    group: root
    mode: "0644"
  failed_when: false
  tags: [cis, cis_6_1_2, permissions, section6]

- name: "CIS 6.1.3 | Ensure permissions on /etc/shadow are configured"
  ansible.builtin.file:
    path: /etc/shadow
    owner: root
    group: root
    mode: "0000"
  tags: [cis, cis_6_1_3, permissions, section6]

- name: "CIS 6.1.4 | Ensure permissions on /etc/shadow- are configured"
  ansible.builtin.file:
    path: /etc/shadow-
    owner: root
    group: root
    mode: "0000"
  failed_when: false
  tags: [cis, cis_6_1_4, permissions, section6]

- name: "CIS 6.1.5 | Ensure permissions on /etc/group are configured"
  ansible.builtin.file:
    path: /etc/group
    owner: root
    group: root
    mode: "0644"
  tags: [cis, cis_6_1_5, permissions, section6]

- name: "CIS 6.1.6 | Ensure permissions on /etc/gshadow are configured"
  ansible.builtin.file:
    path: /etc/gshadow
    owner: root
    group: root
    mode: "0000"
  tags: [cis, cis_6_1_6, permissions, section6]

- name: "CIS 6.1.7 | Ensure no world-writable files exist"
  ansible.builtin.command:
    cmd: find / -xdev -type f -perm -0002 -not -path "/proc/*" -not -path "/sys/*"
  register: world_writable_files
  changed_when: false
  failed_when: false
  tags: [cis, cis_6_1_7, permissions, section6]

- name: "CIS 6.1.7 | Report world-writable files if found"
  ansible.builtin.debug:
    msg: >
      WARNING: World-writable files found on {{ inventory_hostname }}:
      {{ world_writable_files.stdout_lines }}
      Review and remove write permissions manually.
  when:
    - world_writable_files.stdout_lines is defined
    - world_writable_files.stdout_lines | length > 0
  tags: [cis, cis_6_1_7, permissions, section6]

- name: "CIS 6.1.8 | Ensure no unowned files or directories exist"
  ansible.builtin.command:
    cmd: >
      find / -xdev \( -nouser -o -nogroup \)
      -not -path "/proc/*" -not -path "/sys/*"
  register: unowned_files
  changed_when: false
  failed_when: false
  tags: [cis, cis_6_1_8, permissions, section6]

- name: "CIS 6.1.8 | Report unowned files if found"
  ansible.builtin.debug:
    msg: >
      WARNING: Unowned files found on {{ inventory_hostname }}:
      {{ unowned_files.stdout_lines }}
      Assign ownership manually.
  when:
    - unowned_files.stdout_lines is defined
    - unowned_files.stdout_lines | length > 0
  tags: [cis, cis_6_1_8, permissions, section6]

# ── CIS 6.2 User and Group Settings ──────────────────────────────────────────

- name: "CIS 6.2.1 | Ensure accounts in /etc/passwd use shadowed passwords"
  ansible.builtin.command:
    cmd: awk -F':' '($2 != "x") {print $1}' /etc/passwd
  register: non_shadow_accounts
  changed_when: false
  tags: [cis, cis_6_2_1, users, section6]

- name: "CIS 6.2.1 | Report accounts not using shadow passwords"
  ansible.builtin.debug:
    msg: >
      WARNING: Accounts not using shadowed passwords on {{ inventory_hostname }}:
      {{ non_shadow_accounts.stdout_lines }}
  when:
    - non_shadow_accounts.stdout_lines is defined
    - non_shadow_accounts.stdout_lines | length > 0
  tags: [cis, cis_6_2_1, users, section6]

- name: "CIS 6.2.3 | Ensure root PATH integrity"
  ansible.builtin.command:
    cmd: echo $PATH
  register: root_path
  changed_when: false
  become: true
  tags: [cis, cis_6_2_3, users, section6]

- name: "CIS 6.2.3 | Warn if empty directory in root PATH"
  ansible.builtin.debug:
    msg: "WARNING: Root PATH contains empty element or relative path on {{ inventory_hostname }}"
  when: '"::" in root_path.stdout or root_path.stdout.startswith(":")'
  tags: [cis, cis_6_2_3, users, section6]

- name: "CIS 6.2.6 | Ensure root is the only UID 0 account"
  ansible.builtin.command:
    cmd: awk -F':' '($3 == 0) {print $1}' /etc/passwd
  register: uid_zero_accounts
  changed_when: false
  tags: [cis, cis_6_2_6, users, section6]

- name: "CIS 6.2.6 | Assert only root has UID 0"
  ansible.builtin.assert:
    that:
      - uid_zero_accounts.stdout_lines | length == 1
      - uid_zero_accounts.stdout_lines[0] == 'root'
    fail_msg: >
      CRITICAL: Multiple UID 0 accounts found on {{ inventory_hostname }}:
      {{ uid_zero_accounts.stdout_lines }}
      Remove or reassign UIDs immediately.
    success_msg: "CIS 6.2.6: Only root has UID 0 — PASS"
  tags: [cis, cis_6_2_6, users, section6]

# ── Compliance Record ─────────────────────────────────────────────────────────

- name: "Record Section 6 completion"
  ansible.builtin.lineinfile:
    path: "{{ cis_report_dir }}/compliance_run_{{ compliance_run_id | default('manual') }}.log"
    line: >
      {{ ansible_date_time.iso8601 }} Section6_COMPLETE
      host={{ inventory_hostname }}
    create: true
    mode: "0640"
  tags: [cis, section6, always]
